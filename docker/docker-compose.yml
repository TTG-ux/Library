version: '3.9'

services:
  # Приложение библиотеки
  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://library-db:5432/librarydb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-library}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-library_secret}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_JWT_SECRET=${JWT_SECRET:-LibraryManagementSystemSecretKey2024VeryLongAndSecureKeyForJWTAuthentication}
      - APP_JWT_EXPIRATION=86400000
      - JAVA_OPTS=-Xms512m -Xmx1024m
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - library-network
    volumes:
      - library-data:/app/data
      - library-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # PostgreSQL база данных
  library-db:
    image: postgres:16-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=librarydb
      - POSTGRES_USER=${DB_USERNAME:-library}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-library_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-library} -d librarydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'


  # pgAdmin (опционально, для администрирования БД)

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: library-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@library.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin_secret}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - library-db
    networks:
      - library-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    profiles:
      - tools


  # Prometheus (мониторинг, опционально)

  prometheus:
    image: prom/prometheus:latest
    container_name: library-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - library-network
    profiles:
      - monitoring


  # Grafana (визуализация, опционально)

  grafana:
    image: grafana/grafana:latest
    container_name: library-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-grafana_secret}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - library-network
    profiles:
      - monitoring

# Сети
networks:
  library-network:
    driver: bridge
    name: library-network

# Тома
volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local
  library-data:
    driver: local
  library-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local