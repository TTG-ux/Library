# ===========================================
# ОСНОВНЫЕ НАСТРОЙКИ
# ===========================================
spring.application.name=Library Management System
server.port=8080
spring.profiles.active=dev

# ===========================================
# БАЗА ДАННЫХ H2
# ===========================================
spring.datasource.url=jdbc:h2:mem:librarydbDB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================================
# JWT
# ===========================================
app.jwt.secret=LibraryManagementSystemSecretKey2024VeryLongAndSecureKeyForJWTAuthentication
app.jwt.expiration=86400000

# ===========================================
# SPRING RETRY
# ===========================================
spring.retry.enabled=true

# ===========================================
# ACTUATOR
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true

# Информация о приложении
info.app.name=Library Management System
info.app.version=2.0.0
info.app.description=Production-ready Library Management System
info.app.java.version=21

# ===========================================
# ЛОГИРОВАНИЕ
# ===========================================
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.vladislav.library=DEBUG
logging.level.org.springframework.security=WARN

# ===========================================
# THYMELEAF
# ===========================================
spring.thymeleaf.cache=false