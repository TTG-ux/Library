<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Библиотечная система</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/reader.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="/reader" class="logo-link">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>Библиотечная система</span>
            </div>
        </a>
        <ul class="nav-menu">
            <li><a href="#" class="nav-link"><i class="fas fa-book-reader"></i> Мои книги</a></li>
            <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выход</a></li>
        </ul>
    </div>
</nav>

<div class="reader-container">
    <div class="reader-header">
        <div class="header-content">
            <div class="header-icon">
                <i class="fas fa-book-reader"></i>
            </div>
            <div>
                <h1>Личный кабинет читателя</h1>
                <p>Ваши активные книги и история выдач</p>
            </div>
        </div>
    </div>

    <div class="stats-cards">
        <div class="stat-card clickable" onclick="showInfo('total')">
            <div class="stat-icon blue"><i class="fas fa-book"></i></div>
            <div class="stat-info">
                <h3 id="totalBooks">0</h3>
                <p>Всего книг <i class="fas fa-info-circle"></i></p>
            </div>
        </div>
        <div class="stat-card clickable" onclick="showInfo('active')">
            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
                <h3 id="activeCount">0</h3>
                <p>Активно <i class="fas fa-info-circle"></i></p>
            </div>
        </div>
        <div class="stat-card clickable" onclick="showInfo('overdue')">
            <div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-info">
                <h3 id="overdueCount">0</h3>
                <p>Просрочено <i class="fas fa-info-circle"></i></p>
            </div>
        </div>
    </div>

    <div class="books-list" id="booksList">
        <div class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Загрузка данных...</p>
        </div>
    </div>
</div>

<!-- Информационное модальное окно -->
<div class="info-modal-overlay" id="infoModal">
    <div class="info-modal">
        <div class="info-modal-header">
            <h3 id="infoModalTitle">Информация</h3>
            <button class="modal-close" id="closeInfoModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="info-modal-body" id="infoModalBody">
            <!-- Контент загружается динамически -->
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/reader.js"></script>
</body>
</html>
