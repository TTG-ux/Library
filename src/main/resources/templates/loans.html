<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выдача книг</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Навигация -->
<nav class="navbar">
    <div class="nav-container">
        <a href="/" class="logo-link">
            <div class="logo">
                <i class="fas fa-book-open"></i>
                <span>Библиотека</span>
            </div>
        </a>
        <ul class="nav-menu">
            <li><a href="/" class="nav-link" data-page="home"><i class="fas fa-home"></i> Главная</a></li>
            <li><a href="/books" class="nav-link" data-page="books"><i class="fas fa-book"></i> Книги</a></li>
            <li><a href="/readers" class="nav-link" data-page="readers"><i class="fas fa-users"></i> Читатели</a></li>
            <li><a href="/loans" class="nav-link" data-page="loans"><i class="fas fa-exchange-alt"></i> Выдача</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-exchange-alt"></i> Выдача книг</h1>
        <button class="btn btn-primary" onclick="openLoanModal()">
            <i class="fas fa-plus"></i> Выдать книгу
        </button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all')">Все выдачи</button>
        <button class="tab-btn" onclick="switchTab('overdue')">Просроченные</button>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Книга</th>
                <th>Читатель</th>
                <th>Дата выдачи</th>
                <th>Срок возврата</th>
                <th>Дата возврата</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="loansTableBody">
            <!-- Данные загружаются через JS -->
            </tbody>
        </table>
    </div>
</div>

<!-- Модальное окно выдачи -->
<div id="loanModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Выдать книгу</h2>
            <span class="close" onclick="closeLoanModal()">&times;</span>
        </div>
        <form id="loanForm" onsubmit="issueBook(event)">
            <div class="form-group">
                <label>Книга *</label>
                <select id="loanBookId" required>
                    <option value="">Выберите книгу</option>
                </select>
            </div>
            <div class="form-group">
                <label>Читатель *</label>
                <select id="loanReaderId" required>
                    <option value="">Выберите читателя</option>
                </select>
            </div>
            <div class="form-group">
                <label>Срок возврата *</label>
                <input type="date" id="loanDueDate" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeLoanModal()">Отмена</button>
                <button type="submit" class="btn btn-primary">Выдать</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    let loans = [];
    let books = [];
    let readers = [];
    let currentTab = 'all';

    async function loadData() {
        try {
            const [loansRes, booksRes, readersRes] = await Promise.all([
                fetch('/api/loans/reader/0').catch(() => []),
                fetch('/api/books'),
                fetch('/api/readers')
            ]);

            books = await booksRes.json();
            readers = await readersRes.json();

            // Загружаем все выдачи
            loans = [];
            for (const reader of readers) {
                try {
                    const readerLoans = await fetch(`/api/loans/reader/${reader.id}`).then(r => r.json());
                    loans.push(...readerLoans);
                } catch (e) {}
            }

            renderLoans();
            populateSelects();
        } catch (error) {
            showError('Ошибка загрузки данных');
        }
    }

    function renderLoans() {
        const tbody = document.getElementById('loansTableBody');
        const today = new Date().toISOString().split('T')[0];

        const filtered = currentTab === 'overdue'
            ? loans.filter(l => l.status === 'ACTIVE' && l.dueDate < today)
            : loans;

        tbody.innerHTML = filtered.map(loan => {
            const book = books.find(b => b.id === loan.book?.id);
            const reader = readers.find(r => r.id === loan.reader?.id);
            const isOverdue = loan.status === 'ACTIVE' && loan.dueDate < today;

            return `
                    <tr class="${isOverdue ? 'row-overdue' : ''}">
                        <td>${loan.id}</td>
                        <td>${book ? book.title : 'N/A'}</td>
                        <td>${reader ? `${reader.firstName} ${reader.lastName}` : 'N/A'}</td>
                        <td>${loan.loanDate}</td>
                        <td>${loan.dueDate}</td>
                        <td>${loan.returnDate || '-'}</td>
                        <td>
                            <span class="badge ${getStatusBadgeClass(loan.status, isOverdue)}">
                                ${isOverdue ? 'ПРОСРОЧЕНО' : loan.status}
                            </span>
                        </td>
                        <td>
                            ${loan.status === 'ACTIVE' ? `
                                <button class="btn-icon btn-success" onclick="returnBook(${loan.id})">
                                    <i class="fas fa-undo"></i>
                                </button>
                            ` : '-'}
                        </td>
                    </tr>
                `;
        }).join('');
    }

    function getStatusBadgeClass(status, isOverdue) {
        if (isOverdue) return 'badge-danger';
        if (status === 'RETURNED') return 'badge-success';
        return 'badge-warning';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderLoans();
    }

    function populateSelects() {
        const bookSelect = document.getElementById('loanBookId');
        const readerSelect = document.getElementById('loanReaderId');

        bookSelect.innerHTML = '<option value="">Выберите книгу</option>' +
            books.filter(b => b.availableCopies > 0).map(b =>
                `<option value="${b.id}">${b.title} - ${b.author} (Доступно: ${b.availableCopies})</option>`
            ).join('');

        readerSelect.innerHTML = '<option value="">Выберите читателя</option>' +
            readers.map(r =>
                `<option value="${r.id}">${r.firstName} ${r.lastName} (${r.email})</option>`
            ).join('');
    }

    function openLoanModal() {
        document.getElementById('loanForm').reset();
        document.getElementById('loanModal').style.display = 'block';
    }

    function closeLoanModal() {
        document.getElementById('loanModal').style.display = 'none';
    }

    async function issueBook(event) {
        event.preventDefault();
        const loanData = {
            bookId: parseInt(document.getElementById('loanBookId').value),
            readerId: parseInt(document.getElementById('loanReaderId').value),
            dueDate: document.getElementById('loanDueDate').value
        };

        try {
            const response = await fetch('/api/loans', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loanData)
            });

            if (response.ok) {
                closeLoanModal();
                await loadData();
                showSuccess('Книга выдана');
            } else {
                const error = await response.json();
                showError(error.message || 'Ошибка выдачи');
            }
        } catch (error) {
            showError('Ошибка сети');
        }
    }

    async function returnBook(loanId) {
        if (confirm('Подтвердить возврат книги?')) {
            try {
                const response = await fetch(`/api/loans/${loanId}/return`, { method: 'PUT' });
                if (response.ok) {
                    await loadData();
                    showSuccess('Книга возвращена');
                }
            } catch (error) {
                showError('Ошибка возврата');
            }
        }
    }

    loadData();
</script>
<script>
    // Автоматическая активация кнопки навигации
    document.addEventListener('DOMContentLoaded', function() {
        // Определяем текущую страницу
        const currentPage = window.location.pathname;
        const navLinks = document.querySelectorAll('.nav-link');

        // Сопоставление путей и страниц
        const pageMap = {
            '/': 'home',
            '/index.html': 'home',
            '/books': 'books',
            '/books.html': 'books',
            '/readers': 'readers',
            '/readers.html': 'readers',
            '/loans': 'loans',
            '/loans.html': 'loans'
        };

        // Получаем текущую страницу
        const currentRoute = pageMap[currentPage] || 'home';

        // Убираем active со всех ссылок
        navLinks.forEach(link => link.classList.remove('active'));

        // Добавляем active на нужную ссылку
        const activeLink = document.querySelector(`.nav-link[data-page="${currentRoute}"]`);
        if (activeLink) {
            activeLink.classList.add('active');
        }
    });
</script>
</body>
</html>
