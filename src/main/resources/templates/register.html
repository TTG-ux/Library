<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Библиотечная система</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Регистрация</h1>
                <p class="subtitle">Создание учётной записи</p>
            </div>

            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regUsername">
                        <i class="fas fa-user"></i> Логин
                    </label>
                    <input type="text" id="regUsername" placeholder="Придумайте логин" required minlength="3">
                    <span class="form-hint">Минимум 3 символа</span>
                </div>

                <div class="form-group">
                    <label for="regPassword">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="regPassword" placeholder="Придумайте пароль" required minlength="6">
                    <span class="form-hint">Минимум 6 символов</span>
                </div>

                <div class="form-group">
                    <label for="regRole">
                        <i class="fas fa-user-tag"></i> Тип учётной записи
                    </label>
                    <select id="regRole" required>
                        <option value="READER">📚 Читатель</option>
                        <option value="ADMIN"> Сотрудник библиотеки</option>
                    </select>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="fas fa-user-plus"></i> Зарегистрироваться
                </button>
            </form>

            <div class="auth-footer">
                <p>Уже есть учётная запись? <a href="/login" class="auth-link">Войти</a></p>
            </div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
