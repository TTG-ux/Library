<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Библиотечная система</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1>Библиотечная система</h1>
                <p class="subtitle">Вход в систему управления</p>
            </div>

            <form class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Логин
                    </label>
                    <input type="text" id="username" placeholder="Введите логин" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="password" placeholder="Введите пароль" required>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i> Войти в систему
                </button>
            </form>

            <div class="auth-footer">
                <p>Нет учётной записи? <a href="/register" class="auth-link">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
